name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: make CFLAGS="-O2 -Wall -Wextra -Werror -std=c11"

      - name: Build (Windows, MinGW gcc)
        if: runner.os == 'Windows'
        run: gcc -O2 -Wall -Wextra -Werror -std=c11 -o cube.exe cube.c -lm

      - name: Smoke test
        shell: bash
        run: ./cube --help
